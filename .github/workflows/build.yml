name: Builds

on:
  push:
    branches:
      - base
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Clang_Tidy:
    name: Clang Tidy
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ubuntu-26.04
      compiler: clang
      compiler_version: 22
      build_type: Debug
      tracy: false
      build_modules: false
      save_cache: true
      upload_artifact: false
      clang_tidy: true

  Runner_Build:
    name: ${{ matrix.save_cache && 'Cache Build' || 'Build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            runner: windows-2025
            compiler: msvc
            tracy: false
            build_modules: false
            save_cache: false
            upload_artifact: true
            clang_tidy: false
          - build_type: Release
            runner: macos-26
            compiler: appleClang
            tracy: false
            build_modules: false
            save_cache: false
            upload_artifact: true
            clang_tidy: false
          - build_type: Debug
            runner: windows-2025
            compiler: msvc
            tracy: false
            build_modules: false
            save_cache: true
            upload_artifact: false
            clang_tidy: false
          - build_type: Debug
            runner: macos-26
            compiler: appleClang
            tracy: false
            build_modules: false
            save_cache: true
            upload_artifact: false
            clang_tidy: false
          - build_type: Debug
            runner: ubuntu-26.04
            compiler: gcc
            compiler_version: 15
            tracy: false
            build_modules: false
            save_cache: true
            upload_artifact: false
            clang_tidy: false
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ${{ matrix.runner }}
      compiler: ${{ matrix.compiler }}
      compiler_version: ${{ matrix.compiler_version }}
      build_type: ${{ matrix.build_type }}
      build_modules: ${{ matrix.build_modules }}
      tracy: ${{ matrix.tracy }}
      save_cache: ${{ matrix.save_cache }}
      upload_artifact: ${{ matrix.upload_artifact }}
      clang_tidy: ${{ matrix.clang_tidy }}

  ARM64_Build:
    name: ARM64 Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies (ARM64 Linux)
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet \
            g++ \
            ninja-build \
            cmake \
            binutils-dev \
            libluajit-5.1-dev \
            libmariadb-dev-compat \
            libssl-dev \
            libzmq3-dev \
            luajit \
            mariadb-client \
            tzdata \
            zlib1g-dev \
            libzstd-dev \
            libunwind-dev \
            libelf-dev

      - name: Setup GCC (ARM64 Linux)
        run: |
          echo "CC=/usr/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/usr/bin/g++" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python codegen deps
        run: python -m pip install jinja2 jsonschema pyyaml

      - name: Patch cpptrace Autoconfig.cmake (force libdl, disable libdwarf)
        run: |
          echo "Patching cpptrace Autoconfig.cmake to use bundled libdwarf..."
          FILE="ext/cpptrace/cmake/Autoconfig.cmake"
          if [ -f "$FILE" ]; then
            echo "=== Before ==="
            grep -n "CPPTRACE_GET_SYMBOLS_WITH" "$FILE"
            sed -i 's/set(CPPTRACE_GET_SYMBOLS_WITH_LIBDWARF On)/set(CPPTRACE_GET_SYMBOLS_WITH_LIBDWARF OFF)/g' "$FILE"
            sed -i 's/set(CPPTRACE_GET_SYMBOLS_WITH_LIBDL ON)/set(CPPTRACE_GET_SYMBOLS_WITH_LIBDL ON)/g' "$FILE"
            echo "=== After ==="
            grep -n "CPPTRACE_GET_SYMBOLS_WITH" "$FILE"
          else
            echo "WARNING: $FILE not found"
          fi

      - name: Configure CMake (ARM64 - use bundled libdwarf)
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPTRACE_USE_EXTERNAL_LIBDWARF=OFF \
            -DCPPTRACE_FIND_LIBDWARF_WITH_PKGCONFIG=OFF \
            -DPCH_ENABLE=ON

      - name: Build
        run: cmake --build build | tee build.log

      - name: Package artifacts
        run: |
          mkdir -p release
          for bin in xi_connect xi_map xi_search xi_world; do
            if [ -f "build/$bin" ]; then
              cp "build/$bin" release/
            fi
          done
          tar czf landsandboat-arm64.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: landsandboat-arm64
          path: landsandboat-arm64.tar.gz
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landsandboat-arm64-logs
          path: |
            build/*.log
          retention-days: 7

  Docker_Build:
    name: ${{ matrix.save_cache && 'Cache Build' || 'Build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            os: ubuntu
            compiler: gcc
            compiler_version: 15
            clang_format_version: 22
            tracy: false
            build_modules: false
            save_cache: false
            publish: true
          # - build_type: Debug
          #   os: ubuntu
          #   compiler: gcc
          #   compiler_version: 14
          #   tracy: false
          #   build_modules: false
          #   save_cache: true
          #   publish: false
          - build_type: Release
            os: alpine
            compiler: clang
            compiler_version: 22
            clang_format_version: 22
            tracy: false
            build_modules: false
            save_cache: false
            publish: true
    uses: ./.github/workflows/docker_build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      compiler_version: ${{ matrix.compiler_version }}
      clang_format_version: ${{ matrix.clang_format_version }}
      build_type: ${{ matrix.build_type }}
      save_cache: ${{ matrix.save_cache }}
      build_modules: ${{ matrix.build_modules }}
      tracy: ${{ matrix.tracy }}
      upload_artifact: false
      publish: ${{ matrix.publish }}
